[project]
name = "afp-planning"
version = "1.0.0"
description = "Planning service: LangGraph agent chain that compiles a brief into a production package."
requires-python = ">=3.11"
dependencies = [
    "afp-schema",
    "afp-validator",
    "afp-state",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-anthropic>=0.1",
    "anthropic>=0.25",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["planning"]
