server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: the SPA talks to both APIs same-origin (so the session cookie is
    # first-party and SameSite=Lax). The trailing slash on both the location and the
    # proxy_pass target strips the /api/<svc>/ prefix, so the upstream apps see
    # app-local paths (/auth/login, /packages, ...), matching install_auth's
    # public-path allow-list.
    location /api/planning/ {
        proxy_pass http://planning:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /briefs runs the planning chain synchronously and blocks until the
        # package is ready. In a real (MOCK=false) run that means several sequential
        # LLM calls (script on Opus, breakdown+prompts on Sonnet) and can take minutes,
        # so the default 60s proxy_read_timeout would 504 mid-run. MOCK returns instantly
        # and is unaffected.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Scheduler carries the SSE status stream (/packages/{id}/events), so buffering is
    # off and the read timeout is long for the whole location — the JSON endpoints are
    # small, so streaming them unbuffered costs nothing and keeps the config simple.
    location /api/scheduler/ {
        proxy_pass http://scheduler:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: all non-API routes resolve to index.html (client-side router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
