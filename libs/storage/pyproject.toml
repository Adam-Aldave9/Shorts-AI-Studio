[project]
name = "afp-storage"
version = "1.0.0"
description = "Thin boto3/MinIO object-storage helper for the AI Film Pipeline (shared by the driver, compositor, and worker)."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["storage"]
