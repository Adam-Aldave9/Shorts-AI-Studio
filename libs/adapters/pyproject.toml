[project]
name = "afp-adapters"
version = "1.0.0"
description = "Uniform provider adapters (fal.ai, ElevenLabs) plus mock mode for the AI Film Pipeline."
requires-python = ">=3.11"
dependencies = [
    "afp-schema",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adapters"]
