[project]
name = "afp-rate-limiter"
version = "1.0.0"
description = "Redis token-bucket rate limiter + per-project cost tracker for the AI Film Pipeline."
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rate_limiter"]
