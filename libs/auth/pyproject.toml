[project]
name = "afp-auth"
version = "1.0.0"
description = "Shared session-based authentication for the AI Film Pipeline (Argon2id passwords, opaque Redis sessions, CSRF) — installed by every browser-facing service."
requires-python = ">=3.11"
dependencies = [
    "afp-state",
    "afp-rate-limiter",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "redis>=5.0",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auth"]
