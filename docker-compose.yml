# AI Film Pipeline — local development stack (spec §2.4, §3.3).
# Each application service is one container; redis/postgres/minio are off-the-shelf.
# The `harness` (spec item 6) is a run-on-demand CLI, not a long-running container,
# so it is intentionally not defined here.

name: ai-film-pipeline

services:
  # ---- Infrastructure -------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afp
      POSTGRES_PASSWORD: afp
      POSTGRES_DB: afp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afp"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Application services -------------------------------------------------
  planning:
    build:
      context: .
      dockerfile: planning/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://afp:afp@postgres:5432/afp
      MOCK: ${MOCK:-false}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://afp:afp@postgres:5432/afp
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://afp:afp@postgres:5432/afp
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-film-assets}
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      FAL_API_KEY: ${FAL_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      MOCK: ${MOCK:-false}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    deploy:
      replicas: 1   # scaled up by the harness for the throughput experiments
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  compositor:
    build:
      context: .
      dockerfile: compositor/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://afp:afp@postgres:5432/afp
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-film-assets}
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - planning
      - scheduler

volumes:
  pgdata:
  miniodata:
